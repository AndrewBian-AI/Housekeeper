services:
  openilink-hub:
    image: ghcr.io/openilink/openilink-hub:latest
    container_name: openilink-hub
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-9800}:9800"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LISTEN=0.0.0.0:9800
      - DATABASE_URL=/var/lib/openilink-hub/openilink.db
      - RP_ORIGIN=${RP_ORIGIN}
      - RP_ID=${RP_ID}
      - RP_NAME=${RP_NAME:-OpeniLink Hub}
      - SECRET=${SECRET}
    volumes:
      - ./data:/var/lib/openilink-hub

  integration-gateway:
    image: nginx:1.27-alpine
    container_name: housekeeper-integration-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: housekeeper-cloudflared
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?请在 deploy/openilink-hub/.env 中填写 CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run
    depends_on:
      - integration-gateway
